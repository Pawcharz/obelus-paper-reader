# The app tests on Linux, started by hand from the Actions tab. Tests that need handwriting
# recognition are expected to fail here until Linux has a recognizer.
name: App tests on Linux

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: xvfb-run --auto-servernum npm run test:e2e
